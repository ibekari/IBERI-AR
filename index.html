<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>ARありがとうカード</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* MindAR inserts the camera <video> at z-index:-2 (behind <body>),
       so <body> must stay transparent or it hides the live camera feed. */
    background: transparent;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  a-scene { width: 100%; height: 100%; }
  /* keep the A-Frame canvas see-through so the camera feed shows behind the 3D layer */
  a-scene .a-canvas { background: transparent !important; }
  /* never show raw asset images, even if A-Frame fails to boot */
  a-assets, a-assets img { display: none !important; }

  /* Simple instruction banner shown before / while scanning */
  #hint {
    position: fixed;
    left: 0; right: 0;
    top: env(safe-area-inset-top, 0px);
    margin-top: 16px;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.4s ease;
  }
  #hint span {
    background: rgba(0,0,0,0.55);
    color: #fff;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  #hint.hidden { opacity: 0; }

  /* transient toast (illustration switched, etc.) */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 108px);
    transform: translateX(-50%);
    background: rgba(0,0,0,0.62);
    color: #fff;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13px;
    z-index: 26;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #toast.show { opacity: 1; }

  #start-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: linear-gradient(160deg,#fff6e9,#ffe9d6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  #start-overlay h1 {
    font-size: 22px;
    color: #6b4a2b;
    margin: 0 0 12px;
  }
  #start-overlay p {
    font-size: 14px;
    color: #7a5a3a;
    line-height: 1.7;
    max-width: 320px;
    margin: 0 0 24px;
  }
  #start-overlay img {
    width: 140px;
    margin-bottom: 20px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }
  #start-btn {
    background: #e8843a;
    color: #fff;
    border: none;
    padding: 14px 36px;
    font-size: 16px;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(232,132,58,0.4);
  }
  #start-overlay.hidden { display: none; }

  /* stray A-Frame VR / AR entry buttons */
  .a-enter-vr, .a-enter-ar, .a-enter-vr-button, .a-enter-ar-button { display: none !important; }

  /* bottom control bar: ◀  📸  ▶ */
  #controls {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 26px;
    z-index: 25;
    -webkit-tap-highlight-color: transparent;
  }
  #controls.hidden { display: none; }
  #controls button { -webkit-tap-highlight-color: transparent; }
  #shutter {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.9);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-size: 26px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #shutter:active { transform: scale(0.92); }
  .navbtn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .navbtn:active { transform: scale(0.9); background: rgba(0,0,0,0.6); }

  /* photo preview overlay */
  #shot {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(20,14,10,0.92);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px;
    box-sizing: border-box;
  }
  #shot.hidden { display: none; }
  #shot img {
    max-width: 100%;
    max-height: 68vh;
    border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #shot .row { display: flex; gap: 14px; }
  #shot button {
    border: none;
    padding: 13px 28px;
    font-size: 15px;
    border-radius: 999px;
    color: #fff;
  }
  #shot .save { background: #e8843a; box-shadow: 0 6px 16px rgba(232,132,58,0.4); }
  #shot .close { background: rgba(255,255,255,0.18); }
  #shot .tip { color: rgba(255,255,255,0.7); font-size: 12px; margin: 0; }
</style>
</head>
<body>

  <div id="start-overlay">
    <img src="./assets/character.png" alt="キャラクター" />
    <h1>ARありがとうカード</h1>
    <p>
      カメラを起動して、目印になっている絵にかざしてみてください。<br />
      イラストが浮かび上がって、メッセージが届きます。
    </p>
    <button id="start-btn">カメラをはじめる</button>
  </div>

  <div id="hint" class="hidden"><span>絵にカメラをゆっくり近づけてください</span></div>
  <div id="toast"></div>

  <div id="controls" class="hidden">
    <button type="button" class="navbtn" id="prev-btn" aria-label="前のイラスト">◀</button>
    <button type="button" id="shutter" aria-label="写真をとる">📸</button>
    <button type="button" class="navbtn" id="next-btn" aria-label="次のイラスト">▶</button>
  </div>

  <div id="shot" class="hidden">
    <img id="shot-img" alt="撮影した写真" />
    <p class="tip">画像を長押しでも保存できます</p>
    <div class="row">
      <button type="button" class="save" id="shot-save">保存</button>
      <button type="button" class="close" id="shot-close">とじる</button>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart: false; uiScanning: yes; uiLoading: no; filterMinCF: 0.00001; filterBeta: 1000;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    shot-grabber
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    embedded
  >
    <a-assets>
      <img id="charImg" src="./assets/001.png" crossorigin="anonymous" />
      <img id="charImg2" src="./assets/002.png" crossorigin="anonymous" />
      <img id="charImg3" src="./assets/003.jpg" crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- floatGroup is held vertical (using the phone's gravity sensor when
           available, otherwise the marker's own normal) and turned to face the
           camera by the "stand-on-ground" component, and its position is
           low-pass filtered to damp tracking tremor. -->
      <a-entity id="floatGroup" position="0 0 0" stand-on-ground>
        <!-- standing character. src / height / bubble (or caption) come from
             VARIANTS[currentVariant], picked with the ◀ ▶ buttons (see the script).
             pivot is the image centre, so restY in the script lifts the feet to the marker. -->
        <a-image
          id="charEntity"
          src="#charImg"
          width="1"
          height="0.892"
          position="0 0.18 0"
          opacity="0"
          transparent="true"
          material="alphaTest: 0.05; side: double"
        ></a-image>

        <!-- sparkle burst layer (sprites created by the script) -->
        <a-entity id="sparkles"></a-entity>

        <!-- speech bubble, generated on the fly from canvas -->
        <a-entity id="bubble" position="0.12 1.2 0.02" scale="0.001 0.001 0.001" visible="false">
          <a-image id="bubbleImg" width="0.9" height="0.42" transparent="true" material="alphaTest: 0.05; side: double"></a-image>
        </a-entity>

        <!-- plain caption strip near the bottom of a "plain" illustration (no speech bubble) -->
        <a-entity id="caption" position="0 0.09 0.02" scale="0.001 0.001 0.001" visible="false">
          <a-image id="captionImg" width="0.7" height="0.12" transparent="true" material="alphaTest: 0.05; side: double"></a-image>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

<script>
  /*
   * shot-grabber
   * ------------
   * Reads the WebGL canvas in `tock` (which A-Frame runs right AFTER the scene
   * is rendered), so the drawing buffer is still valid without needing
   * preserveDrawingBuffer. Call `.grab(cb)` and the callback fires next frame
   * with the freshly-rendered canvas.
   */
  AFRAME.registerComponent("shot-grabber", {
    init: function () { this._cb = null; },
    grab: function (cb) { this._cb = cb; },
    tock: function () {
      const cb = this._cb;
      if (!cb) return;
      this._cb = null;
      cb(this.el.renderer && this.el.renderer.domElement);
    },
  });

  /*
   * Gravity ("true up") tracking.
   * --------------------------------
   * MindAR keeps the scene camera at the origin, aligned with the device, so a
   * vector expressed in the device frame is also valid in the scene world.
   * We take the phone's real orientation from the deviceorientation sensor
   * (same math as three's DeviceOrientationControls), and from it derive which
   * way is really "up", so the character can stand along gravity instead of
   * along a slightly tilted marker. Falls back silently when no sensor / no
   * permission — the component then uses the marker normal instead.
   */
  window.__worldUp = null;
  (function () {
    const zee = new THREE.Vector3(0, 0, 1);
    const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const euler = new THREE.Euler();
    const q0 = new THREE.Quaternion();
    const devQ = new THREE.Quaternion();
    const smooth = new THREE.Vector3();
    let have = false;
    const rad = (d) => (d * Math.PI) / 180;

    function screenAngle() {
      const a =
        (screen.orientation && screen.orientation.angle) ||
        window.orientation ||
        0;
      return rad(a);
    }
    function onOrient(e) {
      if (e.alpha == null || e.beta == null || e.gamma == null) return;
      euler.set(rad(e.beta), rad(e.alpha), -rad(e.gamma), "YXZ");
      devQ.setFromEuler(euler);
      devQ.multiply(q1);
      devQ.multiply(q0.setFromAxisAngle(zee, -screenAngle()));
      // Earth up (world +Y for DeviceOrientationControls) in the device frame
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(devQ.clone().invert());
      if (!Number.isFinite(up.x) || up.lengthSq() < 0.1) return;
      if (!have) { smooth.copy(up); have = true; }
      else smooth.lerp(up, 0.08); // heavy low-pass; real gravity drifts slowly
      if (!window.__worldUp) window.__worldUp = new THREE.Vector3();
      window.__worldUp.copy(smooth).normalize();
    }
    window.__enableTilt = function () {
      const req =
        window.DeviceOrientationEvent &&
        typeof DeviceOrientationEvent.requestPermission === "function"
          ? DeviceOrientationEvent.requestPermission().catch(() => "denied")
          : Promise.resolve("granted");
      req.then((s) => {
        if (s === "granted" || s === undefined) {
          window.addEventListener("deviceorientation", onOrient, true);
        }
      });
    };
  })();

  /*
   * stand-on-ground
   * ---------------
   * Makes the entity stand vertically where the marker is and face the camera:
   *   - "up"      : gravity (see above) when it roughly agrees with the marker,
   *                 otherwise the marker normal.
   *   - "forward" : slow follow of the horizontal direction to the camera;
   *                 frozen when the camera is almost straight overhead.
   *   - position  : exponential smoothing of the tracked marker position.
   *   - rotation  : slerp toward the target (~0.4 s), so tracking tremor is
   *                 low-pass filtered instead of shown frame by frame.
   * The marker's own rotation noise cancels out: the entity's *world*
   * orientation is rebuilt each frame from stable vectors.
   */
  AFRAME.registerComponent("stand-on-ground", {
    init: function () {
      this._worldQ = new THREE.Quaternion();
      this._fwd = new THREE.Vector3();
      this._pos = new THREE.Vector3();
      this._ready = false;
    },
    tick: function (time, dt) {
      const obj = this.el.object3D;
      const cam = this.el.sceneEl && this.el.sceneEl.camera;
      // Before the first detection MindAR leaves the target matrix
      // uninitialised, which would feed NaN into everything below.
      if (!cam || !obj.parent || !obj.visible) {
        this._ready = false;
        return;
      }
      const fin = (v) => v.toArray().every(Number.isFinite);
      const step = Math.min(0.1, (dt || 16) / 1000);

      const parentQ = new THREE.Quaternion();
      const markerPos = new THREE.Vector3();
      const camWorld = new THREE.Vector3();
      obj.parent.getWorldQuaternion(parentQ);
      obj.parent.getWorldPosition(markerPos);
      cam.getWorldPosition(camWorld);
      if (!fin(parentQ) || !fin(markerPos) || !fin(camWorld)) return;

      // ---- 1. smoothed world position -> kills positional tremor ----
      if (!this._ready) this._pos.copy(markerPos);
      else this._pos.lerp(markerPos, 1 - Math.exp(-step / 0.13));
      const localPos = obj.parent.worldToLocal(this._pos.clone());
      if (fin(localPos)) obj.position.copy(localPos);

      // ---- 2. up direction ----
      const markerUp = new THREE.Vector3(0, 0, 1).applyQuaternion(parentQ).normalize();
      let up = markerUp;
      const g = window.__worldUp;
      if (g && fin(g) && g.lengthSq() > 0.1) {
        const gg = g.clone().normalize();
        // trust the sensor only when it broadly agrees with the marker
        if (gg.dot(markerUp) > 0.6) up = gg;
      }

      // ---- 3. forward = slow follow of the horizontal dir to the camera ----
      const toCam = camWorld.clone().sub(this._pos);
      toCam.addScaledVector(up, -toCam.dot(up));
      if (toCam.lengthSq() > 0.03) {
        toCam.normalize();
        if (!this._ready || this._fwd.lengthSq() < 1e-6) this._fwd.copy(toCam);
        else this._fwd.lerp(toCam, 1 - Math.exp(-step / 0.6));
      } else if (!this._ready || this._fwd.lengthSq() < 1e-6) {
        // camera almost overhead at first sight: use the card's printed "up" edge
        this._fwd.copy(new THREE.Vector3(0, 1, 0).applyQuaternion(parentQ));
      }
      this._fwd.addScaledVector(up, -this._fwd.dot(up));
      if (this._fwd.lengthSq() < 1e-6) return;
      this._fwd.normalize();

      // ---- 4. build orientation: image normal(+Z) -> forward, image up(+Y) -> up ----
      const right = new THREE.Vector3().crossVectors(up, this._fwd).normalize();
      const upTrue = new THREE.Vector3().crossVectors(this._fwd, right).normalize();
      const m = new THREE.Matrix4().makeBasis(right, upTrue, this._fwd);
      const worldQ = new THREE.Quaternion().setFromRotationMatrix(m);
      if (!fin(worldQ)) return;

      // Smooth in WORLD space, then convert to local with the *current* parent
      // rotation. This way the marker's own rotation noise cancels exactly
      // (world orientation === the smoothed target) instead of leaking through
      // a lagging local slerp.
      if (!this._ready) {
        this._worldQ.copy(worldQ);
        this._ready = true;
      } else {
        this._worldQ.slerp(worldQ, 1 - Math.exp(-step / 0.4));
      }
      obj.quaternion.copy(parentQ).invert().multiply(this._worldQ);
    },
  });
</script>
<script>
(function () {
  "use strict";

  // ---------- 1. build the speech-bubble texture on a canvas ----------
  // Accepts multi-line text ("\n"). Auto-shrinks the font so the widest line
  // fits, grows the bubble for extra lines, and returns the texture plus its
  // aspect ratio so the <a-image> can be sized to match.
  const BUBBLE_FONT =
    '"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",sans-serif';

  function buildBubbleTexture(text) {
    const S = 4; // supersample for crisp text
    const lines = String(text).split("\n");
    const W = 520 * S;
    const pad = 22 * S; // margin around the body (room for the drop shadow)
    const bodyW = W - pad * 2;
    const sidePad = 34 * S; // text inset inside the body
    const maxTextW = bodyW - sidePad * 2;

    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = 10;
    let ctx = canvas.getContext("2d");

    let font = 60 * S;
    ctx.font = `bold ${font}px ${BUBBLE_FONT}`;
    let widest = 1;
    for (const l of lines) widest = Math.max(widest, ctx.measureText(l).width);
    if (widest > maxTextW) font = Math.max(30 * S, font * (maxTextW / widest));

    const lineH = font * 1.36;
    const textBlockH = lineH * lines.length;
    const bodyH = textBlockH + 34 * S * 2;
    const radius = 36 * S;
    const H = pad + bodyH + 56 * S; // extra room for the tail hanging below

    canvas.height = H;
    ctx = canvas.getContext("2d");

    function roundRectPath(x, y, ww, hh, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + ww, y, x + ww, y + hh, r);
      ctx.arcTo(x + ww, y + hh, x, y + hh, r);
      ctx.arcTo(x, y + hh, x, y, r);
      ctx.arcTo(x, y, x + ww, y, r);
      ctx.closePath();
    }

    // shadow + body
    ctx.save();
    ctx.shadowColor = "rgba(90, 60, 30, 0.35)";
    ctx.shadowBlur = 18 * S;
    ctx.shadowOffsetY = 8 * S;
    roundRectPath(pad, pad, bodyW, bodyH, radius);
    ctx.fillStyle = "#fff7ec";
    ctx.fill();
    ctx.restore();

    // outline
    roundRectPath(pad, pad, bodyW, bodyH, radius);
    ctx.lineWidth = 8 * S;
    ctx.strokeStyle = "#c2793a";
    ctx.stroke();

    // tail (little triangle at bottom-left, pointing down toward the character)
    const tailX = pad + bodyW * 0.28;
    const tailY = pad + bodyH;
    ctx.beginPath();
    ctx.moveTo(tailX - 26 * S, tailY - 4 * S);
    ctx.lineTo(tailX + 10 * S, tailY - 4 * S);
    ctx.lineTo(tailX - 8 * S, tailY + 46 * S);
    ctx.closePath();
    ctx.fillStyle = "#fff7ec";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tailX - 26 * S, tailY - 2 * S);
    ctx.lineTo(tailX - 8 * S, tailY + 46 * S);
    ctx.lineTo(tailX + 8 * S, tailY - 2 * S);
    ctx.lineWidth = 8 * S;
    ctx.strokeStyle = "#c2793a";
    ctx.lineJoin = "round";
    ctx.stroke();
    // cover the seam where tail meets body
    ctx.fillStyle = "#fff7ec";
    ctx.fillRect(pad + 6 * S, pad + bodyH - 10 * S, bodyW - 12 * S, 8 * S);

    // text
    ctx.fillStyle = "#a85a25";
    ctx.font = `bold ${font}px ${BUBBLE_FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const cx = W / 2;
    const firstY = pad + (bodyH - textBlockH) / 2 + lineH / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, cx, firstY + i * lineH));

    return { url: canvas.toDataURL("image/png"), aspect: W / H };
  }

  // ---------- 1b. build the plain-caption pill texture on a canvas ----------
  // Same auto-shrink-to-fit idea as the speech bubble, but a plain rounded
  // pill (no tail) meant to sit near the bottom of a "no speech bubble"
  // illustration.
  function buildCaptionTexture(text) {
    const S = 4;
    const lines = String(text).split("\n");
    const W = 640 * S; // fixed pixel width behind the fixed CAPTION_W metres
    const padX = 30 * S;
    const padY = 16 * S;
    const maxTextW = W - padX * 2;

    const canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = 10;
    let ctx = canvas.getContext("2d");

    let font = 34 * S;
    ctx.font = `bold ${font}px ${BUBBLE_FONT}`;
    let widest = 1;
    for (const l of lines) widest = Math.max(widest, ctx.measureText(l).width);
    if (widest > maxTextW) font = Math.max(16 * S, font * (maxTextW / widest));

    const lineH = font * 1.3;
    const textBlockH = lineH * lines.length;
    const H = textBlockH + padY * 2;

    canvas.height = H;
    ctx = canvas.getContext("2d");

    function roundRectPath(x, y, ww, hh, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + ww, y, x + ww, y + hh, r);
      ctx.arcTo(x + ww, y + hh, x, y + hh, r);
      ctx.arcTo(x, y + hh, x, y, r);
      ctx.arcTo(x, y, x + ww, y, r);
      ctx.closePath();
    }

    roundRectPath(0, 0, W, H, H / 2);
    ctx.fillStyle = "rgba(20, 14, 10, 0.6)";
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = `bold ${font}px ${BUBBLE_FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const cx = W / 2;
    const firstY = padY + lineH / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, cx, firstY + i * lineH));

    return { url: canvas.toDataURL("image/png"), aspect: W / H };
  }

  // ---------- 2. animation helper (ease-out-back "pop") ----------
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function animate({ duration, onUpdate, onDone, easing }) {
    const start = performance.now();
    const ease = easing || easeOutBack;
    function step(now) {
      const t = Math.min(1, (now - start) / duration);
      onUpdate(ease(t), t);
      if (t < 1) requestAnimationFrame(step);
      else if (onDone) onDone();
    }
    requestAnimationFrame(step);
  }
  const linear = (t) => t;

  // ---------- 2b. sparkle sprite texture (a soft 4-point star) ----------
  function buildSparkleTexture() {
    const s = 128;
    const c = document.createElement("canvas");
    c.width = c.height = s;
    const x = c.getContext("2d");
    const cx = s / 2;

    const glow = x.createRadialGradient(cx, cx, 0, cx, cx, cx);
    glow.addColorStop(0.0, "rgba(255,252,244,1)");
    glow.addColorStop(0.18, "rgba(255,244,214,0.55)");
    glow.addColorStop(1.0, "rgba(255,240,200,0)");
    x.fillStyle = glow;
    x.fillRect(0, 0, s, s);

    x.translate(cx, cx);
    // two crossed 4-point stars for a fuller sparkle
    for (const [rot, scale] of [[0, 1], [Math.PI / 4, 0.62]]) {
      x.save();
      x.rotate(rot);
      x.fillStyle = "rgba(255,255,255,1)";
      x.beginPath();
      const pts = 4, rO = s * 0.48 * scale, rI = s * 0.06;
      for (let i = 0; i < pts * 2; i++) {
        const r = i % 2 ? rI : rO;
        const a = (i / (pts * 2)) * Math.PI * 2 - Math.PI / 2;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.closePath();
      x.fill();
      x.restore();
    }
    return c.toDataURL("image/png");
  }

  // ---------- 3. wire everything up once the scene is ready ----------
  const sceneEl = document.querySelector("a-scene");
  const targetEl = document.querySelector("#target");
  const charEntity = document.querySelector("#charEntity");
  const bubbleWrap = document.querySelector("#bubble");
  const bubbleImg = document.querySelector("#bubbleImg");
  const captionWrap = document.querySelector("#caption");
  const captionImg = document.querySelector("#captionImg");

  // What can pop up above the marker. `w` / `h` are the plane size in metres
  // (h/w matches the source image so the feet/bottom sit on the marker).
  // `text`    -> speech bubble above the character with this (line-breakable) text.
  // `caption` -> no speech bubble; instead a small plain caption strip near
  //              the bottom of the illustration.
  // `plain: true` -> no sparkle burst (used together with `caption`).
  const VARIANTS = [
    { img: "#charImg", w: 1, h: 0.892, text: "ありがとな〜" },
    { img: "#charImg2", w: 1, h: 0.907, text: "好きな台詞を入れられるで！" },
    {
      img: "#charImg3",
      w: 0.8,
      h: 0.8 * (2048 / 1460),
      plain: true,
      caption: "※吹き出しを表示しないこともできます",
    },
  ];
  const BUBBLE_W = 0.9; // world width of the speech bubble plane
  const CAPTION_W = 0.9; // world width of the plain-caption pill
  const RISE = 0.28; // how far below its resting spot the character starts
  // resting height: half the character height, so the feet sit on the marker plane
  let restY = VARIANTS[0].h / 2;

  // which illustration is selected (via the ◀ ▶ arrows), and whether the
  // character is on screen right now
  let currentVariant = 0;
  let shownNow = false;

  function applyBubble(text) {
    const { url, aspect } = buildBubbleTexture(text);
    const h = BUBBLE_W / aspect;
    bubbleImg.setAttribute("width", BUBBLE_W);
    bubbleImg.setAttribute("height", h);
    bubbleImg.setAttribute("src", url);
    // keep the tail tip just above the character's head as the bubble grows
    bubbleWrap.setAttribute("position", `0.12 ${(0.99 + h / 2).toFixed(3)} 0.02`);
  }

  function applyCaption(text) {
    const { url, aspect } = buildCaptionTexture(text);
    const h = CAPTION_W / aspect;
    captionImg.setAttribute("width", CAPTION_W);
    captionImg.setAttribute("height", h);
    captionImg.setAttribute("src", url);
  }

  function applyVariant(v) {
    restY = v.h / 2;
    charEntity.setAttribute("width", v.w || 1);
    charEntity.setAttribute("height", v.h);
    charEntity.setAttribute("src", v.img);

    if (v.text) applyBubble(v.text);
    else {
      bubbleWrap.setAttribute("visible", "false");
      bubbleWrap.setAttribute("scale", "0.001 0.001 0.001");
    }

    if (v.caption) applyCaption(v.caption);
    else {
      captionWrap.setAttribute("visible", "false");
      captionWrap.setAttribute("scale", "0.001 0.001 0.001");
    }
  }

  function setBubbleTexture() {
    applyVariant(VARIANTS[0]);
  }
  if (sceneEl.hasLoaded) setBubbleTexture();
  else sceneEl.addEventListener("loaded", setBubbleTexture);

  // ---------- bottom-to-top reveal ----------
  // Shared uniform: 0 = hidden, 1 = fully shown. Injected into the character's
  // standard material so three still handles colour space / tone mapping.
  const revealU = { value: 0 };
  function patchReveal() {
    const mesh = charEntity.getObject3D("mesh");
    if (!mesh || !mesh.material || mesh.material.userData.revealed) return;
    const mat = mesh.material;
    mat.userData.revealed = true;
    mat.onBeforeCompile = (shader) => {
      shader.uniforms.uReveal = revealU;
      shader.vertexShader =
        "varying vec2 vRevUv;\n" +
        shader.vertexShader.replace(
          "#include <uv_vertex>",
          "#include <uv_vertex>\n  vRevUv = uv;"
        );
      shader.fragmentShader =
        "varying vec2 vRevUv;\nuniform float uReveal;\n" +
        shader.fragmentShader.replace(
          "#include <dithering_fragment>",
          "#include <dithering_fragment>\n" +
            "  float _f = 0.34;\n" +
            "  float _edge = uReveal * (1.0 + _f);\n" +
            "  float _wipe = smoothstep(_edge, _edge - _f, vRevUv.y);\n" +
            "  float _fade = smoothstep(0.0, 0.30, uReveal);\n" +
            "  gl_FragColor.a *= _wipe * _fade;"
        );
    };
    mat.needsUpdate = true;
  }
  charEntity.addEventListener("materialtextureloaded", patchReveal);
  charEntity.addEventListener("loaded", patchReveal);
  if (sceneEl.hasLoaded) patchReveal();
  else sceneEl.addEventListener("loaded", patchReveal);

  // ---------- sparkle burst ----------
  const sparkleRoot = document.querySelector("#sparkles");
  const SPARKLE_TEX = buildSparkleTexture();
  const N_SPARKLES = 22;
  const sparkleEls = [];
  for (let i = 0; i < N_SPARKLES; i++) {
    const sp = document.createElement("a-image");
    sp.setAttribute("src", SPARKLE_TEX);
    sp.setAttribute("width", 1);
    sp.setAttribute("height", 1);
    sp.setAttribute(
      "material",
      "shader: flat; transparent: true; blending: additive; depthTest: false; depthWrite: false; opacity: 0"
    );
    sp.setAttribute("visible", "false");
    sparkleRoot.appendChild(sp);
    sparkleEls.push(sp);
  }

  function playSparkle(el, spreadTop, small) {
    const mesh = el.getObject3D("mesh");
    if (!mesh) return;
    const o = el.object3D;
    const px = (Math.random() * 2 - 1) * 0.52;
    const py = 0.05 + Math.random() * spreadTop;
    const pz = (Math.random() * 2 - 1) * 0.12 + 0.08;
    const peak = (small ? 0.05 : 0.09) + Math.random() * 0.06;
    const rise = 0.1 + Math.random() * 0.14;
    const spin = (Math.random() * 2 - 1) * 0.6;
    el.setAttribute("visible", "true");
    animate({
      duration: 480 + Math.random() * 320,
      easing: linear,
      onUpdate: (t) => {
        const bell = Math.sin(Math.min(1, t) * Math.PI); // 0 -> 1 -> 0
        const s = Math.max(0.0001, bell * peak);
        o.scale.set(s, s, s);
        o.position.set(px, py + rise * t, pz);
        o.rotation.z = spin * t;
        if (mesh.material) mesh.material.opacity = bell * (small ? 0.7 : 1);
      },
      onDone: () => el.setAttribute("visible", "false"),
    });
  }

  let ambientTimer = null;
  function stopSparkles() {
    if (ambientTimer) { clearInterval(ambientTimer); ambientTimer = null; }
  }
  function burstSparkles() {
    stopSparkles();
    const top = restY * 2 + 0.15;
    // spread the burst across the (slower) reveal
    sparkleEls.forEach((el, i) =>
      setTimeout(() => playSparkle(el, top, false), i * 26 + Math.random() * 70)
    );
    // one more overlapping wave so it keeps sparkling for a beat
    sparkleEls.forEach((el, i) => {
      if (Math.random() < 0.5)
        setTimeout(() => {
          if (el.getAttribute("visible") === false)
            playSparkle(el, top, i % 2 === 0);
        }, 800 + i * 24 + Math.random() * 180);
    });
    // gentle ongoing twinkle while the character is shown
    ambientTimer = setInterval(() => {
      const el = sparkleEls[Math.floor(Math.random() * sparkleEls.length)];
      if (el.getAttribute("visible") === false)
        playSparkle(el, restY * 2, Math.random() < 0.5);
    }, 420);
  }

  let charAnimId = 0;
  let bubbleAnimId = 0;
  let captionAnimId = 0;

  function showContent() {
    const myChar = ++charAnimId;
    const myBubble = ++bubbleAnimId;
    const myCaption = ++captionAnimId;
    const v = VARIANTS[currentVariant];

    patchReveal();

    // character: rise from just below the marker while a soft edge slowly
    // wipes the image in from the feet upward
    revealU.value = 0;
    animate({
      duration: 2200,
      easing: (t) => -(Math.cos(Math.PI * t) - 1) / 2, // easeInOutSine
      onUpdate: (e) => {
        if (myChar !== charAnimId) return;
        revealU.value = e;
        // opacity is a no-op wash when the reveal shader is active, and a
        // graceful fallback fade if for some reason it did not patch
        charEntity.setAttribute("opacity", Math.min(1, e * 1.25));
      },
    });
    animate({
      duration: 1500,
      easing: (t) => 1 - Math.pow(1 - t, 3), // easeOutCubic
      onUpdate: (e) => {
        if (myChar !== charAnimId) return;
        const y = restY - RISE * (1 - e); // rises up to standing height
        charEntity.setAttribute("position", `0 ${y} 0`);
      },
    });

    // sparkles around the character as it appears (skipped for `plain` variants)
    if (!v.plain) burstSparkles();

    // bubble: pop in once the character is mostly revealed
    if (v.text) {
      bubbleWrap.setAttribute("visible", "true");
      bubbleWrap.setAttribute("scale", "0.001 0.001 0.001");
      setTimeout(() => {
        animate({
          duration: 600,
          onUpdate: (e) => {
            if (myBubble !== bubbleAnimId) return;
            const s = Math.max(0.001, e);
            bubbleWrap.setAttribute("scale", `${s} ${s} ${s}`);
          },
        });
      }, 1150);
    } else {
      bubbleWrap.setAttribute("visible", "false");
    }

    // plain caption: pop in near the bottom of the illustration
    if (v.caption) {
      captionWrap.setAttribute("visible", "true");
      captionWrap.setAttribute("scale", "0.001 0.001 0.001");
      setTimeout(() => {
        animate({
          duration: 500,
          onUpdate: (e) => {
            if (myCaption !== captionAnimId) return;
            const s = Math.max(0.001, e);
            captionWrap.setAttribute("scale", `${s} ${s} ${s}`);
          },
        });
      }, 900);
    } else {
      captionWrap.setAttribute("visible", "false");
    }
  }

  function hideContent() {
    charAnimId++;
    bubbleAnimId++;
    captionAnimId++;
    revealU.value = 0;
    charEntity.setAttribute("opacity", 0);
    charEntity.setAttribute("position", `0 ${restY - RISE} 0`);
    bubbleWrap.setAttribute("visible", "false");
    bubbleWrap.setAttribute("scale", "0.001 0.001 0.001");
    captionWrap.setAttribute("visible", "false");
    captionWrap.setAttribute("scale", "0.001 0.001 0.001");
    stopSparkles();
    sparkleEls.forEach((el) => el.setAttribute("visible", "false"));
  }

  const toastEl = document.getElementById("toast");
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  targetEl.addEventListener("targetFound", () => {
    document.getElementById("hint").classList.add("hidden");
    shownNow = true;
    applyVariant(VARIANTS[currentVariant]);
    showContent();
  });
  targetEl.addEventListener("targetLost", () => {
    document.getElementById("hint").classList.remove("hidden");
    shownNow = false;
    hideContent();
  });

  // ◀ ▶ : switch which illustration appears
  function switchVariant(dir) {
    currentVariant =
      (currentVariant + dir + VARIANTS.length) % VARIANTS.length;
    applyVariant(VARIANTS[currentVariant]);
    if (shownNow) showContent();
    else showToast(`イラスト ${currentVariant + 1} / ${VARIANTS.length}`);
  }
  document.getElementById("prev-btn").addEventListener("click", () => switchVariant(-1));
  document.getElementById("next-btn").addEventListener("click", () => switchVariant(1));

  // ---------- 4. screenshot (camera feed + 3D layer composited) ----------
  const shutter = document.getElementById("shutter");
  const controls = document.getElementById("controls");
  const shotOverlay = document.getElementById("shot");
  const shotImg = document.getElementById("shot-img");
  let shotUrl = null;

  function drawCover(ctx, src, dw, dh) {
    const sw = src.videoWidth || src.width;
    const sh = src.videoHeight || src.height;
    if (!sw || !sh) return;
    const scale = Math.max(dw / sw, dh / sh);
    const w = sw * scale;
    const h = sh * scale;
    ctx.drawImage(src, (dw - w) / 2, (dh - h) / 2, w, h);
  }

  function compose(glCanvas) {
    const video = document.querySelector("video");
    const out = document.createElement("canvas");
    out.width = (glCanvas && glCanvas.width) || window.innerWidth;
    out.height = (glCanvas && glCanvas.height) || window.innerHeight;
    const ctx = out.getContext("2d");

    // camera feed first (cover-fit, exactly how MindAR shows it), then the 3D layer
    if (video && video.videoWidth) drawCover(ctx, video, out.width, out.height);
    else { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, out.width, out.height); }
    if (glCanvas) { try { ctx.drawImage(glCanvas, 0, 0, out.width, out.height); } catch (e) {} }

    out.toBlob((blob) => {
      if (!blob) { alert("写真の作成に失敗しました。もう一度お試しください。"); return; }
      if (shotUrl) URL.revokeObjectURL(shotUrl);
      shotUrl = URL.createObjectURL(blob);
      shotImg.src = shotUrl;
      shotOverlay._blob = blob;
      shotOverlay.classList.remove("hidden");
    }, "image/png");
  }

  function takeShot() {
    const grabber = sceneEl.components && sceneEl.components["shot-grabber"];
    if (grabber) grabber.grab(compose);
    else compose(sceneEl.renderer && sceneEl.renderer.domElement);
  }

  function fileName() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `arigatou-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
  }

  async function saveShot() {
    const blob = shotOverlay._blob;
    if (!blob) return;
    const file = new File([blob], fileName(), { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "ARありがとうカード" });
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return;
      }
    }
    const a = document.createElement("a");
    a.href = shotUrl;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  shutter.addEventListener("click", takeShot);
  document.getElementById("shot-save").addEventListener("click", saveShot);
  document.getElementById("shot-close").addEventListener("click", () => {
    shotOverlay.classList.add("hidden");
  });

  // ---------- 5. start button -> start AR session ----------
  const startOverlay = document.getElementById("start-overlay");
  const startBtn = document.getElementById("start-btn");
  const hint = document.getElementById("hint");

  startBtn.addEventListener("click", () => {
    const arSystem = sceneEl.systems && sceneEl.systems["mindar-image-system"];
    if (!window.AFRAME || !arSystem) {
      alert("ARの読み込みに失敗しました。通信状況の良い場所でページを再読み込みしてください。");
      return;
    }
    // ask for the motion sensor here, while we still have the user gesture (iOS)
    if (typeof window.__enableTilt === "function") window.__enableTilt();
    startOverlay.classList.add("hidden");
    hint.classList.remove("hidden");
    let started;
    try { started = arSystem.start(); } catch (e) { started = Promise.reject(e); }
    Promise.resolve(started)
      .then(() => { controls.classList.remove("hidden"); })
      .catch(() => {
        startOverlay.classList.remove("hidden");
        hint.classList.add("hidden");
        alert("カメラを起動できませんでした。ブラウザのカメラ許可を確認して、もう一度お試しください。");
      });
  });
})();
</script>
</body>
</html>
